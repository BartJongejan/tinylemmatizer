[build-system]
requires = ["setuptools>=77", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cstlempy"
version = "0.1.0"
description = "Small, fast lemmatizer that uses the same rules ('flexrules') as CSTlemma"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Bart Jongejan" }]
requires-python = ">=3.9"
keywords = ["lemmatizer", "lemmatization", "nlp", "cstlemma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/BartJongejan/tinylemmatizer"
"Rule sets" = "https://github.com/kuhumcst/texton-linguistic-resources"
CSTlemma = "https://github.com/kuhumcst/cstlemma"

[tool.setuptools]
# The only module is the C extension defined in setup.py
py-modules = []

[tool.cibuildwheel]
test-requires = ["pytest"]
test-command = "pytest {project}/tests"
